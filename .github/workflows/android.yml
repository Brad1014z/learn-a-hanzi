# CI (docs/specs/01): unit tests gate the APK — if the engine suite (including the
# grading golden corpus) fails, no APK is produced.
name: android

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Test & build APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # Matches gradle/gradle-daemon-jvm.properties so the daemon finds this JDK
      # instead of downloading another one.
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Unit tests, lint, and Android-test compilation
        run: ./gradlew test lint :app:compileDebugAndroidTestKotlin --stacktrace

      - name: Upload test and lint reports
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: test-and-lint-reports
          path: |
            **/build/reports/tests/
            **/build/reports/lint-results*.html

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug

      - name: Upload test APK
        uses: actions/upload-artifact@v6
        with:
          name: hanzi-prototype-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

  device-tests:
    name: Compose UI · API ${{ matrix.api-level }} · ${{ matrix.viewport }}
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - api-level: 26
            density: 480
            viewport: 360x800 dp
          - api-level: 36
            density: 420
            viewport: 412x915 dp
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # Linux hosted runners expose KVM, but the emulator user needs access to it.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Compose tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          profile: pixel_2
          cores: 2
          emulator-boot-timeout: 900
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          script: |
            adb shell wm size 1080x2400
            adb shell wm density ${{ matrix.density }}
            adb shell wm size
            adb shell wm density
            ./gradlew :app:connectedDebugAndroidTest --stacktrace --console=plain
